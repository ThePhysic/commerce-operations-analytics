name: correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: commerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      COMMERCE_DATABASE_URL: postgresql://commerce:synthetic-ci-only@localhost:5432/commerce_test
      COMMERCE_TEST_DATABASE_URL: postgresql://commerce:synthetic-ci-only@localhost:5432/commerce_test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: commerce
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - name: Validate Compose profiles
        run: docker compose config --quiet
      - name: Build batch image
        run: docker build --tag commerce-batch:ci .
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-evidence
          path: |
            warehouse/logs
            warehouse/target/run_results.json
            data/artifacts
          if-no-files-found: ignore

  airflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: commerce_schedule
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_schedule"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Airflow image
        run: docker build --file Dockerfile.airflow --tag commerce-airflow:ci .
      - name: Run finite daily DAG against disposable PostgreSQL
        run: >-
          docker run --rm --network host --memory 2g --cpus 1.5
          -e COMMERCE_DATABASE_URL=postgresql://commerce:synthetic-ci-only@127.0.0.1:5432/commerce_schedule
          --entrypoint /bin/bash commerce-airflow:ci /opt/commerce/scripts/test_airflow.sh
